<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1fb">
<title>وطني ومولدة</title>
<meta name="application-name" content="وطني ومولدة">
<meta name="apple-mobile-web-app-title" content="وطني ومولدة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="err" class="err"></div>

  <!-- status: national grid + generator -->
  <div class="status">
    <div class="srow unk" id="rowGrid">
      <div class="dot" id="dotGrid">⚡</div>
      <div class="stext">
        <div class="st" id="tGrid">الوطنية</div>
        <div class="ss" id="sGrid">…</div>
      </div>
      <div class="tools">
        <button id="installBtn" class="iconbtn" aria-label="تثبيت التطبيق" style="display:none">📲</button>
        <button id="themeBtn" class="iconbtn" aria-label="تبديل الوضع ليل/نهار">🌙</button>
      </div>
    </div>
    <div class="srow unk" id="rowGen" style="display:none">
      <div class="dot" id="dotGen">⚙️</div>
      <div class="stext">
        <div class="st" id="tGen">المولدة</div>
        <div class="ss" id="sGen">…</div>
      </div>
    </div>
  </div>

  <!-- period: from / to (default = current week, Saturday → today) -->
  <div class="range">
    <label class="rf"><span>من</span><b class="dv"></b><span class="ci">📅</span><input type="date" id="fromD"></label>
    <label class="rf"><span>إلى</span><b class="dv"></b><span class="ci">📅</span><input type="date" id="toD"></label>
  </div>

  <div class="card">
    <div class="tl-head">
      <span class="d"></span>
      <span class="barlbl">خلال اليوم (٢٤ ساعة)</span>
      <span class="cnt">عدد</span>
      <span class="dsum">المدة</span>
    </div>
    <div id="timeline"></div>
    <div class="legend">
      <span><i style="background:var(--onfill)"></i> الوطنية</span>
      <span id="lgGen"><i style="background:var(--genfill)"></i> المولدة</span>
      <span><i style="background:var(--off)"></i> بدون كهرباء</span>
      <span><i style="background:var(--nodata);border:1px solid var(--line)"></i> لا توجد بيانات</span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>اليوم</th><th>من</th><th>إلى</th><th>المدة</th></tr></thead>
      <tbody id="outBody"><tr><td colspan="4" class="empty">…</td></tr></tbody>
    </table>
  </div>

  <div class="foot">وطني ومولدة · © مثنى الصافي</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="box">
    <h4 id="sheetTitle"></h4>
    <div id="sheetBody"></div>
    <button class="close" id="sheetClose">تم</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// The customer's link carries their Google Apps Script id (?s=) and view key (?k=). Both are
// remembered so the home-screen icon keeps working. Data comes straight from the customer's
// own Google Sheet; nothing passes through any other server.
const CRED = (() => {
  const q = new URLSearchParams(location.search), s = q.get("s"), k = q.get("k");
  if (s && k && /^[\w-]{20,120}$/.test(s) && /^[0-9a-f]{24}$/.test(k)) {
    try { localStorage.setItem("wm_cred", JSON.stringify({ s, k })); } catch {}
    return { s, k };
  }
  try { return JSON.parse(localStorage.getItem("wm_cred") || "null"); } catch { return null; }
})();

const TEXT = {
  grid: { on: "الوطنية موجودة", off: "الوطنية مقطوعة", back: "رجعت", gone: "انقطعت" },
  gen:  { on: "المولدة شغّالة", off: "المولدة مطفأة", back: "اشتغلت", gone: "انطفأت" },
};

let selDay = "", data = null, range = null, parts = [], END = 0;

// Read the from/to fields (swap if reversed, no future dates, at most MAX_RANGE days).
function rangeOf(){
  const today = keyOf(new Date());
  let f = $("fromD").value || weekStartKey(), t = $("toD").value || today;
  if (t > today) t = today;
  if (f > t) [f, t] = [t, f];
  const minF = keyOf(new Date(dayStart(t) - (MAX_RANGE - 1)*DAY));
  if (f < minF) f = minF;
  $("fromD").value = f; $("toD").value = t; syncDates();
  return { from:f, to:t };
}
const live = () => range && range.to >= keyOf(new Date());   // auto-refresh only if the range reaches today

async function load(){
  if (!CRED) { showErr("افتح رابط التطبيق من ملف Google Sheet الخاص بجهازك (القائمة ⚡ وطني ومولدة ← الإعداد والروابط)."); return; }
  range = rangeOf();
  try{
    const url = `https://script.google.com/macros/s/${CRED.s}/exec?k=${CRED.k}&from=${range.from}&to=${range.to}`;
    const res = await fetch(url, { cache:"no-store" });
    if (!res.ok) throw new Error("تعذّر الاتصال بملف Google (" + res.status + ")");
    const j = await res.json();
    if (j.error) throw new Error(j.error === "forbidden" ? "الرابط غير صالح. افتح الرابط الجديد من ملف Google Sheet." : j.error);
    data = j;
    $("err").style.display = "none";
    render();
  }catch(e){ showErr(e instanceof TypeError ? "تعذّر الاتصال. تأكد من الإنترنت ومن نشر السكربت (Anyone)." : e.message); }
}
function showErr(m){ $("err").textContent = m; $("err").style.display = "block"; }

function statusRow(which, rowId, tId, sId){
  const s = data[which], T = TEXT[which], row = $(rowId), g = which === "gen" ? " gen" : "";
  const open = s.offs.find(o => !o.ended_at), lastEnd = s.offs.find(o => o.ended_at);
  if (s.on == null){
    row.className = "srow unk" + g; $(tId).textContent = which === "grid" ? "الوطنية" : "المولدة";
    $(sId).textContent = "بانتظار أول قراءة من الجهاز…";
  } else if (s.on){
    row.className = "srow on" + g; $(tId).textContent = T.on;
    $(sId).textContent = lastEnd ? `${T.back} ${relDay(lastEnd.ended_at)}الساعة ${tm(lastEnd.ended_at)}` : "";
  } else {
    row.className = "srow off" + g; $(tId).textContent = T.off;
    $(sId).textContent = open ? `منذ ${dur(Date.now() - new Date(open.started_at).getTime())} · ${T.gone} ${relDay(open.started_at)}${tm(open.started_at)}` : "";
  }
}

// Split every national-grid outage into "on the generator" (yellow) and "no power" (red) parts.
function splitParts(){
  const t = (d) => new Date(d).getTime();
  const gen = data.gen && (data.gen.on != null || data.gen.offs.length) ? data.gen.offs.map(o => [t(o.started_at), o.ended_at ? t(o.ended_at) : END]) : null;
  const out = [];
  for (const o of data.grid.offs){
    const a = t(o.started_at), z = o.ended_at ? t(o.ended_at) : END, open = !o.ended_at;
    if (!gen){ out.push({ k:"none", a, z, open }); continue; }
    const cuts = gen.map(([s, e]) => [Math.max(s, a), Math.min(e, z)]).filter(([s, e]) => e > s).sort((x, y) => x[0] - y[0]);
    let p = a;
    for (const [s, e] of cuts){
      if (e <= p) continue;
      if (s > p) out.push({ k:"gen", a:p, z:s });
      out.push({ k:"none", a:Math.max(s, p), z:e });
      p = e;
    }
    if (z > p) out.push({ k:"gen", a:p, z });
    if (open && out.length) out[out.length - 1].open = true;
  }
  return out.filter(x => x.z > x.a).sort((x, y) => y.a - x.a);
}

function render(){
  document.title = data.name ? `${data.name} · وطني ومولدة` : "وطني ومولدة";
  const hasGen = !!data.gen;
  $("lgGen").style.display = hasGen ? "" : "none";
  if (data.online){
    statusRow("grid", "rowGrid", "tGrid", "sGrid");
    if (hasGen) statusRow("gen", "rowGen", "tGen", "sGen");
    $("rowGen").style.display = hasGen ? "" : "none";
    $("dotGrid").textContent = "⚡";
  } else {
    // device silent: the last known state can't be trusted, say so instead
    $("rowGrid").className = "srow unk"; $("dotGrid").textContent = "📡";
    $("tGrid").textContent = "الجهاز غير متصل";
    $("sGrid").textContent = data.last_seen ? `آخر اتصال قبل ${dur(Date.now() - new Date(data.last_seen).getTime())}` : "لم يتصل بعد · تأكد من الكهرباء والواي فاي";
    $("rowGen").style.display = "none";
  }

  const now = Date.now();
  const since = data.since ? new Date(data.since).getTime() : Infinity;
  END = data.online ? now : (data.last_seen ? new Date(data.last_seen).getTime() : now);
  parts = splitParts();
  $("timeline").innerHTML = timelineRows(range, data.grid.offs, parts, since, END, now);
  if (selDay && !$("timeline").querySelector(`[data-key="${selDay}"]`)) selDay = "";
  highlightDay(); renderLog();
}

function highlightDay(){
  document.querySelectorAll("#timeline .tl-row").forEach(r => r.classList.toggle("sel", !!selDay && r.dataset.key === selDay));
}
function renderLog(){
  const list = selDay ? parts.filter(x => keyOf(new Date(x.a)) === selDay) : parts;
  $("outBody").innerHTML = list.length ? list.map(x => {
    const e = x.open ? `<b style="color:var(--${x.k === "gen" ? "gen" : "off"})">مستمر</b>` : tm(x.z);
    return `<tr><td><i class="pd ${x.k}"></i>${dayName(x.a)}</td><td>${tm(x.a)}</td><td>${e}</td><td>${dur(x.z - x.a)}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">${selDay ? "لم تنقطع الوطنية في هذا اليوم" : "لا توجد انقطاعات مسجّلة في هذه المدة"}</td></tr>`;
}

// Show dates as yyyy/mm/dd (native date fields follow the phone's format, so they stay invisible on top)
function syncDates(){
  document.querySelectorAll(".rf input[type=date]").forEach(i => {
    const v = i.parentElement.querySelector(".dv");
    if (v) v.textContent = i.value ? i.value.replace(/-/g, "/") : "—";
  });
}
document.querySelectorAll(".rf input[type=date]").forEach(i => {
  i.addEventListener("input", syncDates);
  i.addEventListener("change", syncDates);
  i.addEventListener("click", () => { try { i.showPicker(); } catch (e) {} });
});
["fromD", "toD"].forEach(id => $(id).addEventListener("change", () => { selDay = ""; load(); }));
$("timeline").addEventListener("click", (e) => {
  const row = e.target.closest(".tl-row"); if (!row) return;
  selDay = (selDay === row.dataset.key) ? "" : row.dataset.key;
  highlightDay(); renderLog();
  $("outBody").scrollIntoView({ behavior:"smooth", block:"center" });
});

(function initDates(){
  const today = keyOf(new Date());
  $("fromD").value = weekStartKey(); $("toD").value = today;
  $("fromD").max = today; $("toD").max = today;
  syncDates();
})();

setupTheme($("themeBtn"));
setupInstall($("installBtn"), $("sheet"), $("sheetTitle"), $("sheetBody"), $("sheetClose"));

selDay = keyOf(new Date());   // focus on today when the app opens
load();
setInterval(() => { if (!document.hidden && live()) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && live()) load(); });
</script>
</body>
</html>
