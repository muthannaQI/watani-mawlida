<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1fb">
<title>وطني ومولدة</title>
<meta name="application-name" content="وطني ومولدة">
<meta name="apple-mobile-web-app-title" content="وطني ومولدة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="err" class="err"></div>

  <!-- status: national grid + generator -->
  <div class="status">
    <div class="srow unk" id="rowGrid">
      <div class="dot" id="dotGrid">⚡</div>
      <div class="stext">
        <div class="st" id="tGrid">الوطنية</div>
        <div class="ss" id="sGrid">…</div>
      </div>
      <div class="tools">
        <button id="installBtn" class="iconbtn" aria-label="تثبيت التطبيق" style="display:none">📲</button>
        <button id="themeBtn" class="iconbtn" aria-label="تبديل الوضع ليل/نهار">🌙</button>
      </div>
    </div>
    <div class="srow unk" id="rowGen" style="display:none">
      <div class="dot" id="dotGen">⚙️</div>
      <div class="stext">
        <div class="st" id="tGen">المولدة</div>
        <div class="ss" id="sGen">…</div>
      </div>
    </div>
  </div>

  <!-- which line the timeline/log shows -->
  <div class="seg" id="lineSeg" style="display:none">
    <button data-l="grid" class="act">⚡ الوطنية</button>
    <button data-l="gen">⚙️ المولدة</button>
  </div>

  <!-- period selector -->
  <div class="seg" id="seg">
    <button data-m="w1" class="act">أسبوع</button>
    <button data-m="w2">أسبوعين</button>
    <button data-m="w3">٣ أسابيع</button>
    <button data-m="month">الشهر</button>
    <button data-m="custom">مخصّص</button>
  </div>
  <div class="custom" id="custom">
    <div class="fld"><label>من</label><input type="date" id="fromD"></div>
    <div class="fld"><label>إلى</label><input type="date" id="toD"></div>
    <button class="go" id="goBtn">عرض</button>
  </div>

  <div class="card">
    <div class="tl-head">
      <span class="d"></span>
      <span class="barlbl">خلال اليوم (٢٤ ساعة)</span>
      <span class="cnt">عدد</span>
      <span class="dsum">المدة</span>
    </div>
    <div id="timeline"></div>
    <div class="legend">
      <span><i style="background:var(--onfill)"></i> <span id="lgOn">موجودة</span></span>
      <span><i style="background:var(--off)"></i> <span id="lgOff">مقطوعة</span></span>
      <span><i style="background:var(--nodata);border:1px solid var(--line)"></i> لا توجد بيانات</span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>اليوم</th><th>من</th><th>إلى</th><th>المدة</th></tr></thead>
      <tbody id="outBody"><tr><td colspan="4" class="empty">…</td></tr></tbody>
    </table>
  </div>

  <div class="foot">وطني ومولدة · © مثنى الصافي</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="box">
    <h4 id="sheetTitle"></h4>
    <div id="sheetBody"></div>
    <button class="close" id="sheetClose">تم</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// The customer's link carries their Google Apps Script id (?s=) and view key (?k=). Both are
// remembered so the home-screen icon keeps working. Data comes straight from the customer's
// own Google Sheet; nothing passes through any other server.
const CRED = (() => {
  const q = new URLSearchParams(location.search), s = q.get("s"), k = q.get("k");
  if (s && k && /^[\w-]{20,120}$/.test(s) && /^[0-9a-f]{24}$/.test(k)) {
    try { localStorage.setItem("wm_cred", JSON.stringify({ s, k })); } catch {}
    return { s, k };
  }
  try { return JSON.parse(localStorage.getItem("wm_cred") || "null"); } catch { return null; }
})();

const TEXT = {
  grid: { on: "الوطنية موجودة", off: "الوطنية مقطوعة", back: "رجعت", gone: "انقطعت", lgOn: "موجودة", lgOff: "مقطوعة",
          noneDay: "لا توجد انقطاعات في هذا اليوم", noneRange: "لا توجد انقطاعات مسجّلة في هذه المدة" },
  gen:  { on: "المولدة شغّالة", off: "المولدة مطفأة", back: "اشتغلت", gone: "انطفأت", lgOn: "شغّالة", lgOff: "مطفأة",
          noneDay: "لم تنطفئ المولدة في هذا اليوم", noneRange: "لا توجد إطفاءات مسجّلة في هذه المدة" },
};

let mode = "w1", line = "grid", selDay = "", data = null, range = null;

function rangeOf(){
  const today = keyOf(new Date());
  if (mode === "custom"){
    let f = $("fromD").value || today, t = $("toD").value || today;
    if (f > t) [f, t] = [t, f];
    return { from:f, to:t };
  }
  if (mode === "month"){
    const [y,m] = new Intl.DateTimeFormat("en-CA",{ timeZone:TZ, year:"numeric", month:"2-digit" }).format(new Date()).split("-").map(Number);
    const last = new Date(y, m, 0).getDate(), mm = String(m).padStart(2,"0");
    return { from:`${y}-${mm}-01`, to:`${y}-${mm}-${String(last).padStart(2,"0")}` };
  }
  const n = mode === "w1" ? 7 : mode === "w2" ? 14 : 21;
  return { from: keyOf(new Date(Date.now() - (n-1)*DAY)), to: today };
}

async function load(){
  if (!CRED) { showErr("افتح رابط التطبيق من ملف Google Sheet الخاص بجهازك (القائمة ⚡ وطني ومولدة ← الإعداد والروابط)."); return; }
  range = rangeOf();
  try{
    const url = `https://script.google.com/macros/s/${CRED.s}/exec?k=${CRED.k}&from=${range.from}&to=${range.to}`;
    const res = await fetch(url, { cache:"no-store" });
    if (!res.ok) throw new Error("تعذّر الاتصال بملف Google (" + res.status + ")");
    const j = await res.json();
    if (j.error) throw new Error(j.error === "forbidden" ? "الرابط غير صالح. افتح الرابط الجديد من ملف Google Sheet." : j.error);
    data = j;
    $("err").style.display = "none";
    render();
  }catch(e){ showErr(e instanceof TypeError ? "تعذّر الاتصال. تأكد من الإنترنت ومن نشر السكربت (Anyone)." : e.message); }
}
function showErr(m){ $("err").textContent = m; $("err").style.display = "block"; }

function statusRow(which, rowId, tId, sId){
  const s = data[which], T = TEXT[which], row = $(rowId);
  const open = s.offs.find(o => !o.ended_at), lastEnd = s.offs.find(o => o.ended_at);
  if (s.on == null){
    row.className = "srow unk"; $(tId).textContent = which === "grid" ? "الوطنية" : "المولدة";
    $(sId).textContent = "بانتظار أول قراءة من الجهاز…";
  } else if (s.on){
    row.className = "srow on"; $(tId).textContent = T.on;
    $(sId).textContent = lastEnd ? `${T.back} ${relDay(lastEnd.ended_at)}الساعة ${tm(lastEnd.ended_at)}` : "";
  } else {
    row.className = "srow off"; $(tId).textContent = T.off;
    $(sId).textContent = open ? `منذ ${dur(Date.now() - new Date(open.started_at).getTime())} · ${T.gone} ${relDay(open.started_at)}${tm(open.started_at)}` : "";
  }
}

function render(){
  document.title = data.name ? `${data.name} · وطني ومولدة` : "وطني ومولدة";
  const hasGen = !!data.gen;
  $("lineSeg").style.display = hasGen ? "" : "none";
  if (!hasGen) line = "grid";
  if (data.online){
    statusRow("grid", "rowGrid", "tGrid", "sGrid");
    if (hasGen) statusRow("gen", "rowGen", "tGen", "sGen");
    $("rowGen").style.display = hasGen ? "" : "none";
    $("dotGrid").textContent = "⚡";
  } else {
    // device silent: the last known state can't be trusted, say so instead
    $("rowGrid").className = "srow unk"; $("dotGrid").textContent = "📡";
    $("tGrid").textContent = "الجهاز غير متصل";
    $("sGrid").textContent = data.last_seen ? `آخر اتصال قبل ${dur(Date.now() - new Date(data.last_seen).getTime())}` : "لم يتصل بعد · تأكد من الكهرباء والواي فاي";
    $("rowGen").style.display = "none";
  }

  const T = TEXT[line];
  $("lgOn").textContent = T.lgOn; $("lgOff").textContent = T.lgOff;
  const offs = data[line] ? data[line].offs : [];
  const now = Date.now();
  const since = data.since ? new Date(data.since).getTime() : Infinity;
  const end = data.online ? now : (data.last_seen ? new Date(data.last_seen).getTime() : now);
  $("timeline").innerHTML = timelineRows(range, offs, since, end, now);
  if (selDay && !$("timeline").querySelector(`[data-key="${selDay}"]`)) selDay = "";
  highlightDay(); renderLog();
}

function highlightDay(){
  document.querySelectorAll("#timeline .tl-row").forEach(r => r.classList.toggle("sel", !!selDay && r.dataset.key === selDay));
}
function renderLog(){
  const offs = data && data[line] ? data[line].offs : [];
  const list = selDay ? offs.filter(o => keyOf(new Date(o.started_at)) === selDay) : offs;
  const T = TEXT[line];
  $("outBody").innerHTML = list.length ? list.map(o => {
    const e = o.ended_at ? tm(o.ended_at) : "<b style='color:var(--off)'>مستمر</b>";
    const ms = (o.ended_at ? new Date(o.ended_at) : new Date()) - new Date(o.started_at);
    return `<tr><td>${dayName(o.started_at)}</td><td>${tm(o.started_at)}</td><td>${e}</td><td>${dur(ms)}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">${selDay ? T.noneDay : T.noneRange}</td></tr>`;
}

$("lineSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  line = b.dataset.l;
  document.querySelectorAll("#lineSeg button").forEach(x => x.classList.toggle("act", x === b));
  if (data) render();
});
$("seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m; selDay = "";
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("act", x === b));
  $("custom").classList.toggle("show", mode === "custom");
  if (mode !== "custom") load();
});
$("goBtn").addEventListener("click", () => { selDay = ""; load(); });
$("timeline").addEventListener("click", (e) => {
  const row = e.target.closest(".tl-row"); if (!row) return;
  selDay = (selDay === row.dataset.key) ? "" : row.dataset.key;
  highlightDay(); renderLog();
  $("outBody").scrollIntoView({ behavior:"smooth", block:"center" });
});

(function initDates(){
  const today = keyOf(new Date()), weekAgo = keyOf(new Date(Date.now() - 6*DAY));
  $("toD").value = today; $("toD").max = today; $("fromD").value = weekAgo; $("fromD").max = today;
})();

setupTheme($("themeBtn"));
setupInstall($("installBtn"), $("sheet"), $("sheetTitle"), $("sheetBody"), $("sheetClose"));

selDay = keyOf(new Date());   // focus on today when the app opens
load();
setInterval(() => { if (!document.hidden && mode !== "custom") load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && mode !== "custom") load(); });
</script>
</body>
</html>
