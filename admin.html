<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1fb">
<meta name="robots" content="noindex">
<title>إدارة الأجهزة · وطني ومولدة</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .top h1{flex:1;font-size:19px}
  .in{width:100%;border:1px solid var(--glass-brd);border-radius:10px;padding:10px;font:inherit;font-size:14px;color:var(--text);background:var(--glass)}
  .btn{border:none;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
  .btn.ghost{background:var(--seg-bg);color:var(--text);border:1px solid var(--glass-brd)}
  .btn.red{background:var(--off)}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:8px}
  .chk{display:flex;gap:6px;align-items:center;font-size:14px}
  .dev{padding:12px}
  .dev .nm{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap}
  .tag.on{background:var(--onbg);border-color:var(--onbrd)} .tag.off{background:var(--offbg);border-color:var(--offbrd)} .tag.unk{background:var(--unkbg);border-color:var(--unkbrd)}
  .meta{font-size:12px;margin:6px 0 8px;opacity:.8}
  .summary{display:flex;gap:8px;margin-bottom:12px}
  .summary .card{flex:1;text-align:center;margin:0;padding:10px}
  .summary b{display:block;font-size:22px}
  code{font-family:ui-monospace,Menlo,monospace;font-size:13px;direction:ltr;display:block;word-break:break-all;background:var(--seg-bg);border-radius:8px;padding:8px;user-select:all}
  .qr{display:flex;justify-content:center;margin:10px 0}
  .qr svg{width:220px;height:220px;background:#fff;border-radius:12px;padding:8px}
  .lbl{font-size:12.5px;margin-top:8px;margin-bottom:3px;font-weight:600}
  .note{font-size:12px;opacity:.8;margin-top:4px}
  #toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg1);padding:8px 16px;border-radius:999px;font-size:13px;display:none;z-index:30}
</style>
</head>
<body>
  <div class="top">
    <img src="icon-192.png" alt="" width="34" height="34" style="border-radius:9px">
    <h1>إدارة الأجهزة</h1>
    <button id="themeBtn" class="iconbtn" aria-label="تبديل الوضع ليل/نهار">🌙</button>
    <button id="logoutBtn" class="iconbtn" aria-label="خروج" style="display:none">🚪</button>
  </div>
  <div id="err" class="err" style="margin-bottom:12px"></div>

  <!-- login -->
  <div class="card" id="login">
    <div class="stack">
      <label class="lbl">مفتاح الإدارة</label>
      <input class="in" id="adminKey" type="password" autocomplete="current-password" dir="ltr" placeholder="••••••••">
      <button class="btn" id="loginBtn">دخول</button>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="summary">
      <div class="card"><b id="nAll">٠</b>جهاز</div>
      <div class="card"><b id="nOn">٠</b>متصل</div>
      <div class="card"><b id="nOff">٠</b>غير متصل</div>
    </div>

    <div class="card">
      <div class="stack">
        <div class="lbl" style="margin-top:0">➕ جهاز جديد</div>
        <input class="in" id="newName" placeholder="اسم الزبون (مثال: أبو أحمد – حي الجامعة)">
        <input class="in" id="newNotes" placeholder="ملاحظات (هاتف، عنوان…) – اختياري">
        <div class="row">
          <label class="chk"><input type="checkbox" id="newGen" checked> يوجد اشتراك مولدة</label>
          <span style="flex:1"></span>
          <button class="btn" id="createBtn">إضافة</button>
        </div>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <div class="foot">وطني ومولدة · © مثنى الصافي</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="box" style="max-height:88vh;overflow:auto">
    <h4 id="sheetTitle"></h4>
    <div id="sheetBody"></div>
    <button class="close" id="sheetClose">تم</button>
  </div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let KEY = ""; try { KEY = localStorage.getItem("wm_admin") || ""; } catch {}
let devices = [];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const linkOf = (d) => new URL("app.html?k=" + d.view_key, location.href).href;
function toast(m){ const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 1800); }
function showErr(m){ $("err").textContent = m; $("err").style.display = m ? "block" : "none"; }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("تم النسخ ✓"); } catch { prompt("انسخ:", text); } }

async function api(r, body){
  const res = await fetch(`${WM_API}?r=${r}`, {
    method: body ? "POST" : "GET",
    headers: { "x-admin-key": KEY, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (res.status === 403) { logout(); throw new Error("مفتاح الإدارة غير صحيح"); }
  if (!res.ok) throw new Error(j.error || ("خطأ " + res.status));
  return j;
}

async function refresh(){
  try { devices = (await api("devices")).devices; showErr(""); render(); }
  catch (e) { showErr(e.message); }
}

function lineTag(label, on, online){
  if (!online || on == null) return `<span class="tag unk">${label} ؟</span>`;
  return `<span class="tag ${on ? "on" : "off"}">${label} ${on ? "✓" : "✗"}</span>`;
}

function render(){
  $("nAll").textContent = ar(devices.length);
  $("nOn").textContent = ar(devices.filter(d => d.online).length);
  $("nOff").textContent = ar(devices.filter(d => !d.online).length);
  $("list").innerHTML = devices.length ? devices.map(d => {
    const seen = d.last_seen ? `آخر اتصال: ${relDay(d.last_seen)}${tm(d.last_seen)}` : "لم يتصل بعد";
    const sig = d.rssi != null ? ` · إشارة ${d.rssi} dBm` : "";
    const fw = d.fw ? ` · ${esc(d.fw)}` : "";
    return `<div class="card dev" data-id="${d.id}">
      <div class="row">
        <span class="nm">${esc(d.name)}</span>
        <span class="tag ${d.online ? "on" : "unk"}">${d.online ? "متصل" : "غير متصل"}</span>
      </div>
      <div class="row" style="margin-top:6px">${lineTag("⚡ الوطنية", d.grid_on, d.online)}${d.has_gen ? lineTag("⚙️ المولدة", d.gen_on, d.online) : ""}</div>
      <div class="meta">${seen}${sig}${fw}${d.notes ? "<br>📝 " + esc(d.notes) : ""}</div>
      <div class="row">
        <button class="btn sm" data-a="link">🔗 رابط الزبون</button>
        <button class="btn sm ghost" data-a="key">🔑 مفتاح الجهاز</button>
        <button class="btn sm ghost" data-a="edit">✏️ تعديل</button>
        <button class="btn sm ghost" data-a="more">⋯</button>
      </div>
    </div>`;
  }).join("") : `<div class="card empty">لا توجد أجهزة بعد. أضف أول جهاز من الأعلى.</div>`;
}

function sheet(title, html){
  $("sheetTitle").textContent = title; $("sheetBody").innerHTML = html; $("sheet").classList.add("show");
}
function qrSvg(text){ const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }

function showLink(d){
  const url = linkOf(d);
  sheet(`🔗 رابط الزبون · ${d.name}`, `
    <div class="qr">${qrSvg(url)}</div>
    <code>${esc(url)}</code>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" data-copy="${esc(url)}">نسخ الرابط</button>
      ${navigator.share ? `<button class="btn sm ghost" id="shareBtn">مشاركة</button>` : ""}
    </div>
    <div class="note">يفتحه الزبون ثم يضغط 📲 لتثبيت التطبيق. الرابط خاص بهذا الجهاز فقط.</div>`);
  const sb = $("shareBtn");
  if (sb) sb.onclick = () => navigator.share({ title: "وطني ومولدة", text: "تطبيق حالة الكهرباء الخاص بك", url }).catch(() => {});
}
function showKey(d){
  sheet(`🔑 مفتاح الجهاز · ${d.name}`, `
    <div class="lbl">مفتاح الجهاز (يُكتب في صفحة إعداد الجهاز)</div>
    <code>${esc(d.device_key)}</code>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-copy="${esc(d.device_key)}">نسخ المفتاح</button></div>
    <div class="note">عند أول تشغيل يظهر واي فاي باسم <b dir="ltr">Watani-Setup</b>. اتصل به، اختر واي فاي البيت واكتب كلمة السر، ثم الصق هذا المفتاح.</div>`);
}
function showEdit(d){
  sheet(`✏️ تعديل · ${d.name}`, `
    <div class="stack">
      <div class="lbl">الاسم</div><input class="in" id="eName" value="${esc(d.name)}">
      <div class="lbl">ملاحظات</div><input class="in" id="eNotes" value="${esc(d.notes || "")}">
      <label class="chk"><input type="checkbox" id="eGen" ${d.has_gen ? "checked" : ""}> يوجد اشتراك مولدة</label>
      <button class="btn" id="saveBtn">حفظ</button>
    </div>`);
  $("saveBtn").onclick = async () => {
    try { await api("update", { id: d.id, name: $("eName").value, notes: $("eNotes").value, has_gen: $("eGen").checked });
      $("sheet").classList.remove("show"); toast("تم الحفظ ✓"); refresh(); }
    catch (e) { showErr(e.message); }
  };
}
function showMore(d){
  sheet(`⋯ ${d.name}`, `
    <div class="stack">
      <button class="btn ghost" id="rotView">🔄 رابط زبون جديد</button>
      <div class="note" style="margin-top:-4px">الرابط القديم يتوقف فورًا (مثلًا إذا انتشر الرابط أو انتهى الاشتراك).</div>
      <button class="btn ghost" id="rotDev">🔄 مفتاح جهاز جديد</button>
      <div class="note" style="margin-top:-4px">الجهاز يتوقف حتى تكتب المفتاح الجديد في صفحة إعداده.</div>
      <button class="btn red" id="delBtn">🗑️ حذف الجهاز وسجله</button>
    </div>`);
  const rot = async (which, msg) => {
    if (!confirm(msg)) return;
    try { const { device } = await api("rotate", { id: d.id, which }); toast("تم ✓"); await refresh();
      which === "view" ? showLink(device) : showKey(device); }
    catch (e) { showErr(e.message); }
  };
  $("rotView").onclick = () => rot("view", "إنشاء رابط جديد؟ الرابط الحالي سيتوقف.");
  $("rotDev").onclick = () => rot("device", "إنشاء مفتاح جديد؟ الجهاز سيتوقف حتى تُدخل المفتاح الجديد.");
  $("delBtn").onclick = async () => {
    if (prompt(`للتأكيد اكتب اسم الزبون: ${d.name}`) !== d.name) return;
    try { await api("delete", { id: d.id }); $("sheet").classList.remove("show"); toast("تم الحذف"); refresh(); }
    catch (e) { showErr(e.message); }
  };
}

$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const d = devices.find(x => x.id === b.closest(".dev").dataset.id); if (!d) return;
  ({ link: showLink, key: showKey, edit: showEdit, more: showMore })[b.dataset.a](d);
});
$("sheetBody").addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (b) copy(b.dataset.copy); });
$("sheetClose").onclick = () => $("sheet").classList.remove("show");
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").classList.remove("show"); });

$("createBtn").onclick = async () => {
  const name = $("newName").value.trim();
  if (!name) { $("newName").focus(); return; }
  try {
    const { device } = await api("create", { name, notes: $("newNotes").value.trim(), has_gen: $("newGen").checked });
    $("newName").value = ""; $("newNotes").value = "";
    await refresh();
    sheet(`✅ تمت إضافة ${device.name}`, `
      <div class="lbl">1) مفتاح الجهاز – لصفحة إعداد الجهاز</div>
      <code>${esc(device.device_key)}</code>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-copy="${esc(device.device_key)}">نسخ المفتاح</button></div>
      <div class="lbl" style="margin-top:14px">2) رابط الزبون – يُعطى للزبون</div>
      <div class="qr">${qrSvg(linkOf(device))}</div>
      <code>${esc(linkOf(device))}</code>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-copy="${esc(linkOf(device))}">نسخ الرابط</button></div>`);
  } catch (e) { showErr(e.message); }
};

async function login(){
  KEY = $("adminKey").value.trim();
  if (!KEY) return;
  try { devices = (await api("devices")).devices; try { localStorage.setItem("wm_admin", KEY); } catch {} enter(); }
  catch (e) { showErr(e.message); }
}
function enter(){ $("login").style.display = "none"; $("main").style.display = ""; $("logoutBtn").style.display = ""; showErr(""); render(); }
function logout(){ KEY = ""; try { localStorage.removeItem("wm_admin"); } catch {} $("main").style.display = "none"; $("login").style.display = ""; $("logoutBtn").style.display = "none"; }
$("loginBtn").onclick = login;
$("adminKey").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("logoutBtn").onclick = logout;

setupTheme($("themeBtn"));
if (KEY) { enter(); refresh(); }
setInterval(() => { if (KEY && !document.hidden && !$("sheet").classList.contains("show")) refresh(); }, 30000);
</script>
</body>
</html>
